name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? **Do not file it here.** Report it privately via
        Security -> Report a vulnerability. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you ran, and what you expected instead.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IntentDiff version
      description: Output of `intentdiff --version`, or the extension version.
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, and how you installed IntentDiff.
    validations:
      required: false
