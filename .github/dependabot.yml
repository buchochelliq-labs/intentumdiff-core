# Managed centrally; mirrors the monorepo's .github/dependabot.yml.
# Ecosystems below are only those whose manifests actually exist in this repo.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
