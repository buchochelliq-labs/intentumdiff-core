name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine pins (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: engine
          workspaces: crates/rust-core-host
      - name: Install Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Provision the Tier-C parser components
        # The 25 Tier-C certification tests instantiate real parser components, which
        # live in the sibling intentdiff-<lang>-parser repos. Pull the three they name
        # from those repos' CI artifacts and verify each against the SHA-256 pinned in
        # intentdiff-registry (#95) — the pin is what makes this a supply-chain control
        # and not just a download. Fail-closed on a missing OR unverified component:
        # nothing unpinned reaches the staging dir.
        # Needs SPLIT_REPO_TOKEN to carry the Actions: Read permission (contents:read
        # alone 403s on the workflow-run listing).
        run: |
          pip install "pyyaml>=6.0"
          python scripts/provision_parser_components.py --out build/wasm
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
      - name: Run engine pins (full gate, Tier-C included)
        # Standalone crate (not a workspace member) — run from the crate directory.
        # This was `--no-default-features` (178 + 25 ignored) until component
        # provisioning existed; with INTENTDIFF_TEST_WASM_DIR staged it is the full
        # 203-test gate, matching the monorepo.
        run: cargo test
        working-directory: crates/rust-core-host
        env:
          INTENTDIFF_TEST_WASM_DIR: ${{ github.workspace }}/build/wasm

  cli:
    name: Native CLI builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cli
          workspaces: crates/cli
      - name: Build the intentdiff CLI
        run: cargo build --release
        working-directory: crates/cli

  components:
    name: Wasm components build (index engine + renderers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0 (+ wasm32-wasip2)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: components
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Build the workspace components
        run: cargo build --release --target wasm32-wasip2
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
