name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine pins (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # GitHub does not pass secrets to workflows triggered by a PR from a fork, so on
      # those runs this is 'false'. The steps below branch on it to give outside
      # contributors a real signal instead of a hard failure they cannot fix.
      HAS_SPLIT_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: engine
          workspaces: crates/rust-core-host
      - name: Install Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Provision the Tier-C parser components
        # The 25 Tier-C certification tests instantiate real parser components, which
        # live in the sibling intentumdiff-<lang>-parser repos. Pull the three they name
        # from those repos' CI artifacts and verify each against the SHA-256 pinned in
        # intentumdiff-registry (#95) — the pin is what makes this a supply-chain control
        # and not just a download. Fail-closed on a missing OR unverified component:
        # nothing unpinned reaches the staging dir.
        # Needs SPLIT_REPO_TOKEN to carry the Actions: Read permission (contents:read
        # alone 403s on the workflow-run listing). Skipped on fork PRs, which get no
        # secrets — see the reduced gate below.
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: |
          pip install "pyyaml>=6.0"
          python scripts/provision_parser_components.py --out build/wasm
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
      - name: Run engine pins (full gate, Tier-C included)
        # Standalone crate (not a workspace member) — run from the crate directory.
        # This was `--no-default-features` (178 + 25 ignored) until component
        # provisioning existed; with INTENTUMDIFF_TEST_WASM_DIR staged it is the full
        # 203-test gate, matching the monorepo.
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: cargo test
        working-directory: crates/rust-core-host
        env:
          INTENTUMDIFF_TEST_WASM_DIR: ${{ github.workspace }}/build/wasm
      - name: Run engine pins (fork PR — Tier-C omitted)
        # A fork PR cannot reach the parser artifacts, so the 25 Tier-C certification
        # tests cannot run. Rather than fail on something a contributor has no way to
        # fix, drop the default-on `tier-c-wasm` feature and run the remaining 178
        # pins. Tier-C is still enforced on every branch PR and on main, so nothing
        # merges without the full 203-test gate having run.
        if: env.HAS_SPLIT_TOKEN != 'true'
        run: |
          echo "::notice::Fork PR - SPLIT_REPO_TOKEN unavailable, so the 25 Tier-C tests are skipped. A maintainer run will exercise the full gate."
          cargo test --no-default-features
        working-directory: crates/rust-core-host

  cli:
    name: Native CLI builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cli
          workspaces: crates/cli
      - name: Build the intentumdiff CLI
        run: cargo build --release
        working-directory: crates/cli

  components:
    name: Wasm components build (index engine + renderers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0 (+ wasm32-wasip2)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: components
      - name: Authenticate cross-repo git deps
        # The only cross-repo git dependency here is intentumdiff-plugin-sdk, which is now
        # PUBLIC — so this build resolves anonymously and works on fork PRs, which get no
        # secrets. The step is kept because GITHUB_TOKEN is scoped to THIS repo only: if a
        # private sibling is ever added back as a git dependency, SPLIT_REPO_TOKEN is what
        # lets cargo fetch it. Absence is a warning, not an error, precisely so forks pass.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::notice::SPLIT_REPO_TOKEN not set (expected on fork PRs) - all git dependencies are public, so the build continues"
          fi

      - name: Build the workspace components
        run: cargo build --release --target wasm32-wasip2
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
