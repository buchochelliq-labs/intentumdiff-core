# One-time fix for the CLI's independent lockfile after the Rust host
# dependency upgrade. The job verifies and deletes this workflow in its commit.
name: RC native CLI 48.0.7 lockfile synchronization (one-time)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/rc-cli-lock-sync.yml"
permissions: {}
jobs:
  sync:
    if: github.repository == 'buchochelliq-labs/intentumdiff-core' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/0.0.2-arm64-powershell-digest-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Install Rust toolchain 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Regenerate only independent CLI Cargo resolution and self-remove
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "fix/0.0.2-arm64-powershell-digest-policy"
          cargo metadata --manifest-path crates/cli/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --locked --manifest-path crates/cli/Cargo.toml --format-version 1 > /dev/null
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("crates/cli/Cargo.lock").read_text())
          for name in ("wasmtime", "wasmtime-wasi"):
              versions = [p["version"] for p in lock["package"] if p["name"] == name]
              assert versions == ["48.0.7"], (name, versions)
          assert all(p["version"] != "47.0.3" for p in lock["package"] if p["name"].startswith("wasmtime")), "vulnerable Wasmtime transitive remains"
          PY
          git rm -- .github/workflows/rc-cli-lock-sync.yml
          git add crates/cli/Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::expected the one-time workflow removal to stage a change'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(0.0.2): synchronize native CLI lock with pinned Wasmtime 48.0.7"
          git push origin "HEAD:${HEAD_REF}"
