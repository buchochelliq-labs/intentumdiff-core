[package]
name = "intentumdiff-llm-renderer"
version = "0.1.0"
edition = "2021"
description = "LLM-friendly natural language renderer plugin for IntentumDiff"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.2.0" }
serde_json = "1"
wit-bindgen = { version = "0.57", default-features = false, features = ["std", "macros"] }
