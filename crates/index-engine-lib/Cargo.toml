[package]
name        = "index-engine-lib"
version     = "0.1.0"
edition     = "2021"
description = "Shared symbol/reference-table + cross-file-diff engine for IntentDiff (native core + Wasm plugin)"
license     = "MIT"

[lib]
name = "index_engine_lib"
# Plain rlib — linked into BOTH the index-engine Wasm plugin (crates/index-engine)
# and the native rust-core-host commit path. Never loaded standalone. Mirrors the
# sql-parser-lib pattern so the certified native path can compute symbol tables +
# cross-file changes without a Wasm round-trip.

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
