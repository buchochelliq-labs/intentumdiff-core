[package]
name = "intentumdiff-terminal-renderer"
version = "0.1.0"
edition = "2021"
description = "Terminal (ANSI colour) renderer plugin for IntentumDiff"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.0.2-beta.1" }
serde_json = "1"
wit-bindgen = { version = "0.60", default-features = false, features = ["std", "macros"] }
