[package]
name = "tree-sitter"
version = "0.25.10"
edition = "2021"
license = "MIT"
# Patched: native builds compile the checked-in runtime C sources; wasm32-wasip2
# builds link the checked-in static archive to avoid requiring a wasm C toolchain.
build = "binding_rust/build.rs"
links = "tree-sitter"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "tree_sitter"
path = "binding_rust/lib.rs"

[features]
default = ["std"]
std = [
    "regex/std",
    "regex/perf",
    "regex-syntax/unicode",
]
bindgen = []
wasm = ["std"]

[dependencies.regex]
version = "1.11.1"
features = ["unicode"]
default-features = false

[dependencies.regex-syntax]
version = "0.8.5"
default-features = false

[dependencies.streaming-iterator]
version = "0.1.9"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies.cc]
version = "1.2.10"
