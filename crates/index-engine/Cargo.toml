[package]
name        = "intentumdiff-index-engine"
version     = "0.1.0"
edition     = "2021"
description = "Cross-file semantic index engine plugin for IntentumDiff"
license     = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.0.2-beta.1" }
index-engine-lib = { path = "../index-engine-lib" }
wit-bindgen  = { version = "0.57", default-features = false, features = ["std", "macros"] }

[profile.release-wasm]
inherits  = "release"
opt-level = "z"
lto       = true
strip     = true
