[package]
name = "intentdiff-patch-renderer"
version = "0.1.0"
edition = "2021"
description = "Unified diff (patch) renderer plugin for IntentDiff"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
intentdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentdiff-plugin-sdk", tag = "v0.1.0" }
serde_json = "1"
wit-bindgen = { version = "0.57", default-features = false, features = ["std", "macros"] }
