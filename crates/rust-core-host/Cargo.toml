[package]
name = "intentdiff-rust-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Rust core host for IntentDiff"
license = "MIT"

# The `python` feature + the pyo3 dep were removed (#82/B.6): the crate builds ONLY as the pure
# cdylib. The retired `#[cfg(feature = "python")]` pyo3 skin (the `#[pymodule]`/`#[pyfunction]`
# wrappers) has been fully deleted (#B.6), so no `cfg(feature = "python")` remains to declare.

# tier-c-wasm (DEFAULT ON): gates the 25 Tier-C certification tests that load staged parser
# components (python_parser.wasm etc.). In the monorepo the staging dir exists so the full gate
# always runs; the extracted engine repo (#82) points INTENTDIFF_TEST_WASM_DIR at components
# provisioned from the parser repos' CI artifacts and runs the same full gate (Phase D).
# `--no-default-features` remains the escape hatch for an environment with no components.
[features]
default = ["tier-c-wasm"]
tier-c-wasm = []

[lib]
name = "intentdiff_rust_core"
# cdylib exposing the C ABI (`intentdiff_call`) that every language binding drives (the Python
# ctypes shell loads it via `ctypes.CDLL`); rlib so a pure-Rust consumer (the native live-server
# and lsp-server binaries, #100; the clap CLI, #B.4) can link the engine in-process without FFI.
crate-type = ["cdylib", "rlib"]

# The crate builds ONLY as the pure-Rust engine now (#82/B.6, drop-pyo3): the language boundary is
# the ungated C ABI (`intentdiff_call`), and bindings (the Python ctypes shell, the clap CLI, future
# Go/Java) drive it. The PyO3 `#[pymodule]`/`#[pyfunction]` skin was removed once the ctypes binding
# reached parity (the whole suite passes over the C ABI). The engine compute was always pyo3-free.

[dependencies]
anyhow = "1"
# Shared symbol/reference-table + cross-file-diff engine, also linked into the
# index-engine Wasm plugin. Lets the native host compute cross-file changes
# without a Wasm round-trip (Rust-authoritative for #91).
index-engine-lib = { path = "../index-engine-lib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Project-config (intentdiff.yaml) parsing for the config subsystem port (#99).
# Same version the first-party databricks/dbt-schema parser crates already use.
serde_yaml = "0.9"
# Cache subsystem port (#101, A2.2): SQLite parse/diff cache (bundled SQLite so no
# system libsqlite3 needed) + gzip-compressed BLOB values matching the Python store.
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
# Analytics/telemetry store (#101, A2.2): row ids (uuid) + the "provided" DuckDB
# engine, loaded at RUNTIME via dlopen (libloading) from a configurable libduckdb —
# NOT the bundled `duckdb` crate — with graceful fallback to the bundled SQLite.
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
# Registry-client security validators (#97, A2.3): ref + dep-hash pattern checks.
regex = "1"
# SVN backend (#98, A2.4.4): parse `svn --xml` diff-summarize / status output.
roxmltree = "0.20"
sha2 = "0.10"
hex = "0.4"
# Content-type detection by magic bytes (route text vs binary + enrich diff
# metadata). `infer` (zero-dep, no unsafe in the matcher) is the primary matcher;
# `file-format` is a broader fallback for formats infer does not recognise.
infer = "0.16"
file-format = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.10"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[patch.crates-io]
quote = { path = "../patches/quote" }
zmij = { path = "../patches/zmij" }
serde_core = { path = "../patches/serde_core" }

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
