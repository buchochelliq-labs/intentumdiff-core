[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "intentumdiff-rust-core"
version = "0.1.0"
description = "Native Rust core host for IntentumDiff"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
module-name = "intentumdiff_rust_core"
features = ["pyo3/extension-module"]
