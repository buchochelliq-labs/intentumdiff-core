  - dockerfile
  - elixir
  - generic
  - go
  - gomod
  - groovy
  - haskell
  - hcl
  - html
  - java
  - javascript
  - json
  - kotlin
  - lua
  - m
  - make
  - markdown
  - mdx
  - odin
  - perl
  - php
  - plsql
  - postscript
  - proto
  - powershell
  - puppet
  - python
  - qsharp
  - r
  - ruby
  - rust
  - sas
  - scala
  - scss
  - sql
  - ini
  - toml
  - squirrel
  - svelte
  - swift
  - tsx
  - tsql
  - typescript
  - vbnet
  - vue
  - wat
  - xml
  - yaml
  - zig
  evaluator: style_only_shortcut_evidence
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: syntactic_trivia
  stage: parser_normalization
  guarantee: parser-proven
  explanation: The parser-normalized tree is unchanged after trivia filtering, so source-only layout or
    comment edits were ignored while preserving source-span evidence.
  guards:
  - Only fires after host-side filtered CST structural hashes are identical.
  - Does not run parser plugins or attach semantic node IDs on the fast path.
  - Does not apply when any semantic tree change survives to review output.
  notes: Runtime evidence rule for the fast style-only shortcut; source spans are used because semantic
    nodes are not constructed on this path.
- id: core.integer_literal.canonical_value.safe
  status: implemented
  languages:
  - python
  - javascript
  - typescript
  - tsx
  - csharp
  evaluator: integer_literal_equivalence
  node_types:
  - integer
  - integer_literal
  - numeric_literal
  - number
  group_kind: IGNORED_STYLE
  enabled: true
  risk: green
  equivalence_kind: canonical_value_equivalence
  stage: post_diff_refinement
  guarantee: spec-defined
  explanation: Both integer literal spellings parse to the same exact integer value.
  guards:
  - Only exact integer leaves are enabled; floats, decimals, BigInt suffixes, type suffixes, and overflow-sensitive
    contexts are not hidden.
  - The evaluator records both original spellings and the shared canonical integer value.
  source_refs:
  - https://docs.python.org/3/reference/lexical_analysis.html
  - https://tc39.es/ecma262/
  - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/lexical-structure
  examples:
  - old: '1_000'
    new: '1000'
    canonical: int(1000)
  - old: '0xff'
    new: '255'
    canonical: int(255)
- id: core.number_literal.canonical_value.safe
  status: implemented
  languages:
  - json
  - javascript
  - typescript
  - tsx
  evaluator: number_literal_equivalence
  node_types:
  - number
  - numeric_literal
  - integer
  - float
  group_kind: IGNORED_STYLE
  enabled: true
  risk: green
  equivalence_kind: canonical_value_equivalence
  stage: post_diff_refinement
  guarantee: spec-defined
  explanation: Both number literal spellings parse to the same IEEE-754 double value.
  guards:
  - Only exact bit-identical f64 values are enabled; NaN payloads, infinities, and signed-zero mismatches
    are not hidden.
  - The evaluator records both original spellings and the shared canonical value.
  source_refs:
  - https://www.rfc-editor.org/rfc/rfc8259#section-6
  - https://tc39.es/ecma262/#sec-ecmascript-language-types-number-type
  examples:
  - old: 1e3
    new: '1000'
    canonical: f64(1000.0)
  - old: '1.0'
    new: '1'
    canonical: f64(1.0)
- id: core.string_literal.decoded_value.safe
  status: implemented
  languages:
  - python
  - javascript
  - typescript
  - tsx
  - csharp
  evaluator: string_literal_equivalence
  node_types:
  - string
  - string_literal
  - character_literal
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: canonical_value_equivalence
  stage: post_diff_refinement
  guarantee: spec-defined-with-guards
  explanation: Both string literal spellings decode to the same plain string value.
  guards:
  - Only plain non-interpolated string leaves are enabled.
  - Raw strings, byte strings, regex literals, templates, f-strings, verbatim strings, and source-map-sensitive
    constructs remain visible.
  source_refs:
  - https://docs.python.org/3/reference/lexical_analysis.html
  - https://tc39.es/ecma262/
  - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/lexical-structure
  examples:
  - old: '''semanticdiff.com'''
    new: '"semanticdiff.com"'
    canonical: string(semanticdiff.com)
- id: python.formatting.call_wrapping_equivalence
  status: implemented
  languages:
  - python
  evaluator: formatting_suppression_evidence
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: syntactic_trivia
  stage: group_emission
  guarantee: parser-defined-with-guards
  explanation: Formatting-only Python call wrapping and stable wrapper churn were ignored because the
    review-level semantic changes are already represented by more precise changes.
  guards:
  - Only emits evidence from already-suppressed stable wrapper, reorder, or parent-child noise.
  - Does not hide surviving meaningful literal, identifier, call, deletion, or refactoring changes.
  source_refs:
  - https://docs.python.org/3/reference/lexical_analysis.html
