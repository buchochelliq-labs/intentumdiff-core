  status: implemented
  languages:
  - javascript
  - typescript
  - tsx
  evaluator: formatting_suppression_evidence
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: syntactic_trivia
  stage: group_emission
  guarantee: parser-defined-with-guards
  explanation: Formatting-only JavaScript call and argument wrapping were ignored because the review-level
    semantic changes are already represented by more precise changes.
  guards:
  - Only emits evidence from already-suppressed stable wrapper, reorder, or parent-child noise.
  - Does not hide surviving meaningful literal, API, call, deletion, or refactoring changes.
  source_refs:
