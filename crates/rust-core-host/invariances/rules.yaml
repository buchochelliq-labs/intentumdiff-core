- id: css.color.canonical_equivalence
  status: implemented
  languages:
  - css
  evaluator: css_color_equivalence
  node_types:
  - color_value
  - plain_value
  - identifier
  - hash_color
  - rule_set
  - declaration
  group_kind: IGNORED_STYLE
  enabled: true
  risk: green
  equivalence_kind: canonical_value_equivalence
  stage: post_diff_refinement
  guarantee: spec-defined
  explanation: Both CSS color spellings resolve to the same canonical sRGB color.
  guards:
  - Only exact named, hex, and simple rgb() sRGB cases are enabled in the current evaluator.
  - Do not hide CSS variables, currentColor, system colors, relative colors, color-mix(), cascade-dependent
    values, or lossy color-space conversions.
  source_refs:
  - https://www.w3.org/TR/css-color-4/
  - https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model/CSS_value_serialization
  - https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/
  examples:
  - old: blue
    new: '#0000ff'
    canonical: srgb(0,0,255,1)
  - old: '#00f'
    new: rgb(0 0 255)
    canonical: srgb(0,0,255,1)
- id: markup.attribute_order_and_boolean_equivalence
  status: implemented
  languages:
  - html
  - xml
  evaluator: parser_normalization
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: unordered_collection_equivalence
  stage: parser_normalization
  guarantee: spec-defined-with-guards
  explanation: Markup attribute order, XML attribute order, HTML boolean attribute spelling, and entity
    spelling are normalised at parse time so equivalent forms produce identical semantic trees.
  guards:
  - Namespace declarations (xmlns / xmlns:*) are consumed during QName resolution and stripped from the
    attribute set.
  - Do not hide spread attributes, framework directives, duplicate attributes, child order, preformatted
    text, or binding syntax.
  - HTML class token order is only amber because source spelling and exact attribute selectors may observe
    it.
  source_refs:
  - https://www.w3.org/TR/2004/REC-xml-infoset-20040204/
  - https://html.spec.whatwg.org/dev/common-microsyntaxes.html

- id: catalog.parser_only_languages
  # NOT an evaluator: the explicit classification of languages that ship a parser
  # but have NO invariance rules yet (issue #55). The catalog-coverage contract
  # (test_builtin_catalog_covers_every_registered_parser_language) reads this so
  # every language is deliberately classified — adding a language means either
  # giving it real rules or consciously listing it here.
  enabled: false
  status: catalog
  explanation: >-
    Classification only — these languages ship a parser but have no invariance
    evaluators yet. Listed so the catalog-coverage contract proves every language
    is deliberately classified.
  notes: >-
    Issue #55 pruned 14 dead dormant rules; this entry is the surviving explicit
    exemption list. Move a language OUT by giving it real evaluator-backed rules.
  source_refs:
  - https://github.com/buchochelliq-labs/intentumdiff/issues/55
  languages:
  - asciidoc
  - gitignore
  - graphql
  - latex
  - ocaml
  - po
  - reasonml

