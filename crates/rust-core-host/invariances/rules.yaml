- id: csharp.formatting.initializer_query_output_wrapping_equivalence
  status: implemented
  languages:
  - csharp
  evaluator: formatting_suppression_evidence
  group_kind: IGNORED_STYLE
  enabled: true
  risk: amber
  equivalence_kind: syntactic_trivia
  stage: group_emission
