  explanation: Formatting-only C# initializer, LINQ query, and output-call wrapper churn was ignored because
    the review-level semantic changes are already represented by more precise changes.
  guards:
  - Only emits evidence from already-suppressed stable wrapper, reorder, or parent-child noise.
  - Does not hide surviving meaningful numeric, ordering, format-string, deletion, or refactoring changes.
  source_refs:
